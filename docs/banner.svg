<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12121b"/>
      <stop offset="0.55" stop-color="#0d0d13"/>
      <stop offset="1" stop-color="#08080c"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9147ff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#9147ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00c389" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00c389" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="logoBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a970ff"/>
      <stop offset="1" stop-color="#6f26d8"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#efeff1"/>
      <stop offset="1" stop-color="#c9a6ff"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9147ff"/>
      <stop offset="0.7" stop-color="#00c389"/>
      <stop offset="1" stop-color="#00c389" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <ellipse cx="215" cy="150" rx="260" ry="170" fill="url(#glowA)" filter="url(#soft)"/>
  <ellipse cx="1120" cy="290" rx="300" ry="160" fill="url(#glowB)" filter="url(#soft)"/>

  <!-- декоративные точки -->
  <g fill="#9147ff">
    <circle cx="1150" cy="70" r="2.5" opacity="0.7"/>
    <circle cx="1196" cy="112" r="1.8" opacity="0.45"/>
    <circle cx="1096" cy="128" r="1.5" opacity="0.35"/>
  </g>
  <g fill="#00c389">
    <circle cx="1060" cy="52" r="2" opacity="0.5"/>
    <circle cx="1236" cy="176" r="1.6" opacity="0.3"/>
  </g>

  <!-- логотип -->
  <g transform="translate(64,96)">
    <rect width="128" height="128" rx="36" fill="url(#logoBg)"/>
    <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="35.25" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
    <path d="M 50 36 L 94 64 L 50 92 Z" fill="#ffffff" transform="translate(4,0)"/>
  </g>

  <!-- заголовок -->
  <text x="228" y="146" fill="url(#headline)" font-size="54" font-weight="700" letter-spacing="-1.4">Twitch Drops Farmer</text>
  <text x="230" y="188" fill="#a0a0b0" font-size="21" font-weight="400">Расширение для Chrome и Edge: само находит каналы с дропами</text>
  <text x="230" y="218" fill="#6f6f80" font-size="21" font-weight="400">и переключает между ними по таймеру — в фоновых вкладках.</text>

  <!-- пилюли -->
  <g font-size="13.5" font-weight="600">
    <rect x="230" y="246" width="128" height="32" rx="16" fill="#9147ff" fill-opacity="0.14" stroke="#9147ff" stroke-opacity="0.4"/>
    <text x="294" y="267" fill="#c9a6ff" text-anchor="middle">Manifest V3</text>

    <rect x="370" y="246" width="118" height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="429" y="267" fill="#b6b6c4" text-anchor="middle">Без зависимостей</text>

    <rect x="500" y="246" width="150" height="32" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="575" y="267" fill="#b6b6c4" text-anchor="middle">Chrome / Edge 120+</text>

    <rect x="662" y="246" width="118" height="32" rx="16" fill="#00c389" fill-opacity="0.12" stroke="#00c389" stroke-opacity="0.35"/>
    <text x="721" y="267" fill="#5fd6a9" text-anchor="middle">MIT License</text>
  </g>

  <rect x="0" y="317" width="1280" height="3" fill="url(#rule)"/>
</svg>
